name: Python worker checks

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-tests.yml'

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install fastapi==0.115.12 pydantic==2.11.5 yt-dlp==2025.5.22 requests==2.32.3
      - run: python -m compileall -q worker/app
      - run: PYTHONPATH=worker python -m unittest discover -s worker/tests -v
